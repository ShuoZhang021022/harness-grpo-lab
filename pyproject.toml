[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-grpo-lab"
version = "0.1.0"
description = "Reproducible tool-harness experiments with a trainable controller"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "numpy>=1.26"]
training = ["torch>=2.4", "transformers>=4.51.0", "peft>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]
